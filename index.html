<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый код</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #24324a;
      background: #f4f7fb;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 8%;
      background: #ffffff;
      box-shadow: 0 2px 12px rgba(44, 62, 80, 0.08);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #5865f2;
    }

    nav a {
      margin-left: 20px;
      color: #24324a;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #5865f2;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      padding: 50px;
      border-radius: 24px;
      background: linear-gradient(135deg, #5865f2, #8b5cf6);
      color: white;
    }

    .hero h1 {
      margin-top: 0;
      font-size: 44px;
    }

    .hero p {
      max-width: 500px;
      line-height: 1.6;
    }

    .hero-code {
      min-width: 280px;
      padding: 24px;
      border-radius: 16px;
      background: #20243a;
      font-family: monospace;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.18);
    }

    .hero-code span {
      color: #ffcc66;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: #ffcf5c;
      color: #24324a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffc13d;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      padding: 24px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(44, 62, 80, 0.08);
    }

    .card-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #eceeff;
      font-size: 24px;
    }

    .card h2 {
      margin-bottom: 8px;
    }

    .card p {
      color: #6b7485;
      line-height: 1.5;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 20px;
      background: #e8ebf2;
    }

    .progress div {
      width: 65%;
      height: 100%;
      background: #5865f2;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      color: #7a8291;
    }

    @media (max-width: 760px) {
      header {
        flex-direction: column;
        gap: 14px;
      }

      nav a {
        margin: 0 8px;
      }

      .hero {
        flex-direction: column;
        padding: 35px 24px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .hero-code {
        width: 100%;
        min-width: 0;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">CodeStart</div>

    <nav>
      <a href="#lessons">Уроки</a>
      <a href="#progress">Прогресс</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Привет, ученик! 👋</h1>
        <p>
          Учись писать код шаг за шагом. Смотри примеры,
          выполняй задания и наблюдай за своим прогрессом.
        </p>
        <button id="startButton">Начать урок</button>
      </div>

      <div class="hero-code">
        <div>&lt;h1&gt;<span>Мой первый сайт</span>&lt;/h1&gt;</div>
        <br>
        <div><p>Барбос на связи?</p>
<p>да!<p>
</div>
